[project]
name = "aelyn-conversation"
version = "0.1.0"
description = "AELYN : agent conversationnel (phrase libre -> intention -> action confirmée)"
requires-python = ">=3.11"
dependencies = [
    "aelyn",
    "aelyn-email",
    "aelyn-career",
    "aelyn-media",
    "pydantic>=2.9",
    "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aelyn_conversation"]

[tool.uv.sources]
aelyn = { workspace = true }
aelyn-email = { workspace = true }
aelyn-career = { workspace = true }
aelyn-media = { workspace = true }
