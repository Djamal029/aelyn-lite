[project]
name = "aelyn-email"
version = "0.1.0"
description = "AELYN : agent de tri et réponse aux mails"
requires-python = ">=3.11"
dependencies = [
    "aelyn",
    "pydantic>=2.9",
    "rich>=13.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aelyn_email"]

[tool.uv.sources]
aelyn = { workspace = true }
