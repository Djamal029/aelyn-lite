[project]
name = "aelyn-media"
version = "0.1.0"
description = "AELYN : agent multimédia (contrôle Android TV / Freebox Pop)"
requires-python = ">=3.11"
dependencies = [
    "aelyn",
    "androidtvremote2>=0.3.2",
    "opencv-python>=4.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aelyn_media"]

[tool.uv.sources]
aelyn = { workspace = true }
