[project]
name = "aelyn-security"
version = "0.1.0"
description = "AELYN : agent de sécurité (détection anti-spoofing / liveness faciale)"
requires-python = ">=3.11"
dependencies = [
    "aelyn",
    "ultralytics>=8.0",
    "opencv-python>=4.9",
    "cvzone>=1.6",
    "deepface[tensorflow]>=0.0.93",
    "tf-keras>=2.15",
    # Déclarés explicitement (ultralytics les exige déjà en transitif) pour
    # router vers le build CUDA, cf. tool.uv.sources ci-dessous et le
    # commentaire sur l'index dans le pyproject racine.
    "torch>=2.9",
    "torchvision>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aelyn_security"]

[tool.uv.sources]
aelyn = { workspace = true }
# pytorch-cu130 : même mécanisme et même raison que dans
# career-agent/pyproject.toml (réécrit par le script d'installation selon
# le GPU détecté) — ce fichier pointait, lui aussi et indépendamment, vers
# l'index CUDA 13.0 en dur, et bloquait la résolution de TOUT le workspace
# (une seule et même source doit être choisie pour `torch` sur l'ensemble
# du workspace) même après avoir corrigé career-agent seul.
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
